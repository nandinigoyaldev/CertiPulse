services:
  - type: worker
    name: workshop-invite-bot
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: false
    disk:
      name: whatsapp-session
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: EXCEL_FILE_PATH
        value: /var/data/registrations.xlsx
      - key: SHEET_NAME
        value: Sheet1
      - key: GROUP_LINK
        sync: false
      - key: WHATSAPP_CLIENT_ID
        value: workshop-registration-bot
      - key: WHATSAPP_HEADLESS
        value: true
      - key: MESSAGE_RETRY_COUNT
        value: 3
      - key: MESSAGE_RETRY_DELAY_MS
        value: 5000
      - key: MIN_DELAY_MS
        value: 10000
      - key: MAX_DELAY_MS
        value: 20000